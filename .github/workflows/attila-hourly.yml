name: Attila Spider Engine scheduled preview
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: attila-preview-hourly
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Attila preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/toile-dor-pink-floyd
          persist-credentials: false
      - name: Run Attila safe preview cycle
        run: |
          python3 attila/check_catalog.py
          python3 attila/test_preview.py
          python3 attila/build_preview.py
          python3 attila/catalog_coverage.py
          python3 attila/organic_drafts.py
          python3 attila/editorial_queue.py
      - name: Summarize actual execution
        if: always()
        run: |
          echo '## Attila — hourly preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -f attila/coverage-report.json; then
            python3 -c 'import json; d=json.load(open("attila/coverage-report.json")); print("Catalog:", d["catalog_items"], "| Linked:", d["linked_items"], "| Observed sales: unavailable")' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cycle incomplete: coverage report missing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save private artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attila-preview
          path: |
            attila/preview.html
            attila/coverage-report.json
            attila/organic-drafts.json
            attila/editorial-queue.json
          retention-days: 30
