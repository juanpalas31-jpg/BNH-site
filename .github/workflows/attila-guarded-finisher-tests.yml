name: Attila guarded finisher tests
on:
  push:
    branches:
      - work/attila-preflight-guard-20261101
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finisher execution bridge tests
        run: node attila/execution-bridge.test.mjs
      - name: Project source isolation tests
        run: node attila/project-source-isolation.test.mjs
      - name: Bamak Event read-only integration tests
        run: node attila/bamak-event-readonly.test.mjs
      - name: Mini-Tila colony tests
        run: node attila/mini-tila-colony.test.mjs
      - name: Cognitive runtime tests
        run: node attila/cognitive-runtime.test.mjs
